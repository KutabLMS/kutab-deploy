# Shared edge for a host running ONE OR MORE compose deployments.
#
# Exactly one Traefik owns :80/:443 here and routes to every tenant stack over the
# external `kutab-shared` network — that is what lets you run several client boxes
# on the same host (each tenant stack binds no host ports at all).
#
# Optionally also runs the SHARED MySQL (alias `kutab-db`) that tenants use with
# `deploy.sh --db-mode shared`, so they don't each carry their own database.
#
# Brought up by deploy-edge.sh; independent of any tenant's lifecycle.
name: kutab-edge

services:
  traefik:
    image: traefik:v3.7.5
    # TLS strategy (ACME resolver / self-signed for Cloudflare) comes from
    # traefik.env — generated by deploy-edge.sh from --tls-mode. Host-level now:
    # one Traefik serves every tenant on this box.
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kutab-shared
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    env_file:
      - ${KUTAB_EDGE_DIR}/traefik.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks: [kutab-shared]
    restart: unless-stopped

  # Shared MySQL for every tenant on this host — enable with: --profile shared-db.
  # Named 'shared-db' (NOT 'mysql') on purpose: on the shared network the compose
  # service name becomes a DNS alias, and a tenant's backend also resolves 'mysql'
  # (its own bundled DB) — a service named 'mysql' here would hijack that lookup.
  # Tenants reach this via the explicit 'kutab-db' alias only.
  shared-db:
    image: ${SHARED_DB_IMAGE:-mysql:8.4.8}
    profiles: [shared-db]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON
      - --innodb-buffer-pool-size=${SHARED_DB_BUFFER_POOL:-1G}
    environment:
      MYSQL_ROOT_PASSWORD: ${SHARED_DB_ROOT_PASSWORD}
    volumes:
      - shared-mysql-data:/var/lib/mysql
    networks:
      kutab-shared:
        aliases: [kutab-db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${SHARED_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  # Created here, consumed as `external: true` by every tenant stack.
  kutab-shared:
    name: kutab-shared
    driver: bridge

volumes:
  traefik-acme:
  shared-mysql-data:
